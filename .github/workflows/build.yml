name: Build and Publish Askas Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java Sources
      run: |
        mkdir -p build/classes
        find src -name "*.java" > sources.txt
        javac -d build/classes @sources.txt

    - name: Build Executable JAR
      run: |
        mkdir -p build/libs
        jar cfe build/libs/Askas.jar TerminalPrintOfView.TerminalMain -C build/classes .

    - name: Upload Build Artifact (JAR)
      uses: actions/upload-artifact@v4
      with:
        name: Askas-Terminal-JAR
        path: build/libs/Askas.jar
